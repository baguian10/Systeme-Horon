name: Next.js CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # undici@8 exige Node >= 22.19 et appelle util.markAsUncloneable,
          # absent des Node 20 : sous Node 20 le build échoue à la collecte des
          # pages sur « markAsUncloneable is not a function ». L'échec restait
          # invisible tant que l'étape ESLint s'arrêtait avant le build.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
